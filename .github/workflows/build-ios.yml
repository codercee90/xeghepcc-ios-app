name: Build and Upload iOS App to TestFlight

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: macos-latest

    steps:
      # =========================================================================
      # 1. CHECKOUT SOURCE CODE
      # =========================================================================
      - name: Checkout Repository
        uses: actions/checkout@v4

      # =========================================================================
      # 2. SETUP NODE.JS & INSTALL DEPENDENCIES
      # =========================================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node_version: '24'

      - name: Install NPM Dependencies & Plugins
        run: |
          npm ci || npm install
          npm install @capacitor-community/background-geolocation @capacitor-firebase/messaging --save || true

      - name: Build Web App
        run: npm run build --if-present

      - name: Create GoogleService-Info.plist
        run: |
          mkdir -p ios/App/App
          echo "${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}" > ios/App/App/GoogleService-Info.plist

      - name: Capacitor Sync iOS
        run: |
          npx cap add ios || true
          npx cap sync ios

      # =========================================================================
      # TỰ ĐỘNG BỎ QUA XÁC NHẬN MISSING COMPLIANCE
      # =========================================================================
      - name: Add Export Compliance Flag to Info.plist
        run: |
          PLIST_PATH="ios/App/App/Info.plist"
          if [ -f "$PLIST_PATH" ]; then
            /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST_PATH" || \
            /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" "$PLIST_PATH"
          fi

      # =========================================================================
      # 3. TỰ ĐỘNG CẬP NHẬT VERSION VÀ BUILD NUMBER
      # =========================================================================
      - name: Update Version and Build Number
        run: |
          cd ios/App
          xcrun agvtool new-marketing-version "1.9"
          xcrun agvtool new-version -all "${{ github.run_number }}"
          cd ../..

      # =========================================================================
      # 4. IMPORT CERTIFICATE (.P12) AND PROVISIONING PROFILE
      # =========================================================================
      - name: Install Certificate and Provisioning Profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/embedded.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode > $CERTIFICATE_PATH
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode > $PP_PATH

          PP_UUID=$(security cms -D -i $PP_PATH | xmllint --xpath '//key[text()="UUID"]/following-sibling::string[1]/text()' -)
          PP_NAME=$(security cms -D -i $PP_PATH | xmllint --xpath '//key[text()="Name"]/following-sibling::string[1]/text()' -)
          
          echo "PP_UUID=$PP_UUID" >> $GITHUB_ENV
          echo "PP_NAME=$PP_NAME" >> $GITHUB_ENV

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/$PP_UUID.mobileprovision

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 3600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          curl -fL https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer -o $RUNNER_TEMP/AppleWWDRCAG3.cer
          security import $RUNNER_TEMP/AppleWWDRCAG3.cer -k $KEYCHAIN_PATH

          security import $CERTIFICATE_PATH -k $KEYCHAIN_PATH -P "$P12_PASSWORD" -A -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security default-keychain -s $KEYCHAIN_PATH

      # =========================================================================
      # 5. TẠO FILE EXPORTOPTIONS.PLIST CHUẨN APP STORE / TESTFLIGHT
      # =========================================================================
      - name: Create ExportOptions.plist
        run: |
          BUNDLE_ID="cc.xeghep.www.ios"

          cat <<EOF > ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>teamID</key>
              <string>HK58UX9N3D</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>signingCertificate</key>
              <string>Apple Distribution</string>
              <key>uploadSymbols</key>
              <true/>
              <key>stripSwiftSymbols</key>
              <true/>
              <key>manageAppVersionAndBuildNumber</key>
              <false/>
              <key>provisioningProfiles</key>
              <dict>
                  <key>${BUNDLE_ID}</key>
                  <string>${PP_NAME}</string>
              </dict>
          </dict>
          </plist>
          EOF

      # =========================================================================
      # 6. BUILD ARCHIVE VÀ EXPORT IPA (LINK ENTITLEMENTS CHUẨN RUBY XCODEPROJ)
      # =========================================================================
      - name: Build and Export IPA
        run: |
          # 1. Dùng Ruby can thiệp chính xác vào Target App để gán file Entitlements
          ruby -r xcodeproj -e '
          project = Xcodeproj::Project.open("ios/App/App.xcodeproj")

          # Chỉ chọn Target ứng dụng chính (App), bỏ qua tất cả Swift Package Targets
          app_target = project.targets.find { |t| t.name == "App" }

          if app_target
            puts "==> Dang can thiep duy nhat vao Target: #{app_target.name}"

            # Tao File Reference neu chua co
            group = project.main_group["App"] || project.main_group
            file_ref = group.find_file_by_path("App.entitlements") || group.new_file("App.entitlements")

            app_target.build_configurations.each do |config|
              config.build_settings["CODE_SIGN_ENTITLEMENTS"] = "App/App.entitlements"
            end

            project.save
            puts "==> Inject Entitlements cho Target App THANH CONG!"
          else
            puts "==> LOI: Khong tim thay Target App!"
          end
          '

          # 2. Tạo xcconfig ép Profile cho riêng Target App (Tránh dính các package SPM)
          cat <<EOF > app_signing.xcconfig
          CODE_SIGN_IDENTITY = Apple Distribution
          DEVELOPMENT_TEAM = HK58UX9N3D
          CODE_SIGN_STYLE = Manual
          PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*][target=App] = ${PP_NAME}
          EOF

          # 3. Archive ứng dụng
          xcodebuild -project ios/App/App.xcodeproj \
                     -scheme App \
                     -configuration Release \
                     -sdk iphoneos \
                     -archivePath build/App.xcarchive \
                     -xcconfig app_signing.xcconfig \
                     archive \

          # 4. Export IPA
          xcodebuild -exportArchive \
                     -archivePath build/App.xcarchive \
                     -exportOptionsPlist ExportOptions.plist \
                     -exportPath build/output

          # 5. Đảm bảo file .ipa đầu ra luôn mang tên App.ipa chuẩn cho Bước 8
          cd build/output
          IPA_FILE=$(ls *.ipa | head -n 1)
          if [ "$IPA_FILE" != "App.ipa" ]; then
            mv "$IPA_FILE" App.ipa
          fi

      # =========================================================================
      # 7. UPLOAD IPA LÊN GITHUB ARTIFACTS
      # =========================================================================
      - name: Upload IPA to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-signed-app
          path: build/output/App.ipa
          retention-days: 7

      # =========================================================================
      # 8. UPLOAD IPA LÊN TESTFLIGHT & PHÂN PHỐI TỰ ĐỘNG (FASTLANE)
      # =========================================================================
      - name: Upload and Distribute to TestFlight
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          # 1. Tạo file JSON chứa đầy đủ cấu hình App Store Connect API Key
          cat <<EOF > api_key.json
          {
            "key_id": "$KEY_ID",
            "issuer_id": "$ISSUER_ID",
            "key": "$PRIVATE_KEY",
            "is_key_content_base64": true
          }
          EOF

          # 2. Chạy Fastlane trỏ tới file JSON
          fastlane run upload_to_testflight \
          api_key_path:"api_key.json" \
          ipa:"build/output/App.ipa" \
          skip_waiting_for_build_processing:false \
          uses_non_exempt_encryption:false \
          groups:"Testers" \
          changelog:"Bản cập nhật tính năng mới và sửa các lỗi tồn đọng."

          # 3. Dọn dẹp file key tạm
          rm -f api_key.json
