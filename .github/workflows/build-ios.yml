name: Build iOS App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm ci

      - name: Build Web App (Bỏ qua nếu không có script)
        run: npm run build --if-present

      - name: Capacitor Sync iOS
        run: |
          npx cap add ios || true
          npx cap sync ios

      # BƯỚC 7 TỐI ƯU: Cài CocoaPods & Chạy Pod Install
      - name: Install CocoaPods Dependencies
        run: |
          sudo gem install cocoapods
          cd ios/App
          if [ ! -f "Podfile" ]; then
            pod init
          fi
          pod install --repo-update

      # BƯỚC 8: Build Xcode
      - name: Build Xcode App
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace \
                     -scheme App \
                     -configuration Release \
                     -sdk iphoneos \
                     -derivedDataPath build \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO

      - name: Create Unsigned IPA Package
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/App.app Payload/
          zip -r App-unsigned.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-unsigned
          path: App-unsigned.ipa
          retention-days: 7
