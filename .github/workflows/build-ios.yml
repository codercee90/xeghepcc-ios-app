name: Build and Upload iOS App to TestFlight

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: macos-latest

    steps:
      # =========================================================================
      # 1. CHECKOUT SOURCE CODE
      # =========================================================================
      - name: Checkout Repository
        uses: actions/checkout@v4

      # =========================================================================
      # 2. SETUP NODE.JS & INSTALL DEPENDENCIES
      # =========================================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node_version: '24'

      - name: Install NPM Dependencies & Plugins
        run: |
          npm install
          npm install @capacitor-community/background-geolocation @capacitor-firebase/messaging --save || true

      - name: Create GoogleService-Info.plist
        run: |
          mkdir -p ios/App/App
          echo "${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}" > ios/App/App/GoogleService-Info.plist

      # Build Web Assets & Đồng bộ chuẩn vào Capacitor iOS
      - name: Build Web App & Sync Capacitor
        run: |
          npm run build
          #npx cap add ios || true
          #npx cap copy ios
          npx cap sync ios

      # Tự động bỏ qua xác nhận Export Compliance trên Info.plist SAU KHHI SYNC
      - name: Add Export Compliance Flag to Info.plist
        run: |
          PLIST_PATH="ios/App/App/Info.plist"
          if [ -f "$PLIST_PATH" ]; then
            /usr/libexec/PlistBuddy -c "Add :CFBundleExecutable string App" "$PLIST_PATH" || \
            /usr/libexec/PlistBuddy -c "Set :CFBundleExecutable App" "$PLIST_PATH"
            
            /usr/libexec/PlistBuddy -c "Add :MinimumOSVersion string 13.0" "$PLIST_PATH" || \
            /usr/libexec/PlistBuddy -c "Set :MinimumOSVersion 13.0" "$PLIST_PATH"

            /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST_PATH" || \
            /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" "$PLIST_PATH"
          fi

      # =========================================================================
      # 3. TỰ ĐỘNG CẬP NHẬT VERSION VÀ BUILD NUMBER
      # =========================================================================
      - name: Update Version and Build Number
        run: |
          cd ios/App
          xcrun agvtool new-marketing-version "1.9"
          xcrun agvtool new-version -all "${{ github.run_number }}"
          cd ../..

      # =========================================================================
      # 4. IMPORT CERTIFICATE (.P12) AND PROVISIONING PROFILE
      # =========================================================================
      - name: Install Certificate and Provisioning Profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/embedded.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo "$BUILD_CERTIFICATE_BASE64" | tr -d '\r\n ' | base64 --decode > $CERTIFICATE_PATH
          echo "$BUILD_PROVISION_PROFILE_BASE64" | tr -d '\r\n ' | base64 --decode > $PP_PATH

          PP_NAME=$(security cms -D -i $PP_PATH | grep -A1 '<key>Name</key>' | grep '<string>' | sed -e 's/.*<string>//' -e 's/<\/string>.*//')
          PP_UUID=$(security cms -D -i $PP_PATH | grep -A1 '<key>UUID</key>' | grep '<string>' | sed -e 's/.*<string>//' -e 's/<\/string>.*//')

          echo "PP_UUID=$PP_UUID" >> $GITHUB_ENV
          echo "PP_NAME=$PP_NAME" >> $GITHUB_ENV

          echo "==> Loaded Profile Name: '$PP_NAME'"
          echo "==> Loaded Profile UUID: '$PP_UUID'"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp $PP_PATH "$HOME/Library/MobileDevice/Provisioning Profiles/$PP_UUID.mobileprovision"

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 3600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security default-keychain -s $KEYCHAIN_PATH
          security list-keychains -s $KEYCHAIN_PATH $(security list-keychains | xargs)

          curl -fL https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer -o $RUNNER_TEMP/AppleWWDRCAG3.cer
          security import $RUNNER_TEMP/AppleWWDRCAG3.cer -k $KEYCHAIN_PATH

          security import $CERTIFICATE_PATH -k $KEYCHAIN_PATH -P "$P12_PASSWORD" -A -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

      # =========================================================================
      # 5. TẠO FILE EXPORTOPTIONS.PLIST CHUẨN APP STORE / TESTFLIGHT
      # =========================================================================
      - name: Create ExportOptions.plist
        env:
          PP_NAME: ${{ env.PP_NAME }}
        run: |
          BUNDLE_ID="cc.xeghep.www.ios"

          cat <<EOF > ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>destination</key>
              <string>export</string>
              <key>teamID</key>
              <string>HK58UX9N3D</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>signingCertificate</key>
              <string>Apple Distribution</string>
              <key>uploadSymbols</key>
              <false/>
              <key>stripSwiftSymbols</key>
              <false/>
              <key>compileBitcode</key>
              <false/>
              <key>manageAppVersionAndBuildNumber</key>
              <false/>
              <key>thinning</key>
              <string>&lt;none&gt;</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>${BUNDLE_ID}</key>
                  <string>${PP_NAME}</string>
              </dict>
          </dict>
          </plist>
          EOF

      # =========================================================================
      # 6. BUILD ARCHIVE VÀ EXPORT IPA (TỐI ƯU SIGNING VA ENTITLEMENTS)
      # =========================================================================
      - name: Build and Export IPA
        env:
          PP_NAME: ${{ env.PP_NAME }}
        run: |
          # 1. Tạo file App.entitlements vật lý
          mkdir -p ios/App/App
          cat <<EOF > ios/App/App/App.entitlements
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>aps-environment</key>
              <string>production</string>
          </dict>
          </plist>
          EOF

          # 2. Dùng Ruby cấu hình Manual Signing cho App Target và xóa Signing rác ở Plugin Target
          ruby -r xcodeproj -e '
          project_path = "ios/App/App.xcodeproj"
          project = Xcodeproj::Project.open(project_path)
          app_target = project.targets.find { |t| t.name == "App" }

          if app_target
            puts "==> Cấu hình Signing và Entitlements..."

            # Thêm file reference vào Xcode Project nếu chưa xuất hiện
            app_group = project.main_group["App"] || project.main_group
            file_ref = app_group.find_file_by_path("App.entitlements")
            unless file_ref
              app_group.new_file("App/App.entitlements")
            end

            project.targets.each do |target|
              target.build_configurations.each do |config|
                config.build_settings["IPHONEOS_DEPLOYMENT_TARGET"] = "13.0"
                
                if target.name == "App"
                  config.build_settings["ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES"] = "YES"
                  config.build_settings["CODE_SIGN_STYLE"] = "Manual"
                  config.build_settings["CODE_SIGN_IDENTITY"] = "Apple Distribution"
                  config.build_settings["DEVELOPMENT_TEAM"] = "HK58UX9N3D"
                  config.build_settings["PROVISIONING_PROFILE_SPECIFIER"] = ENV["PP_NAME"]
                  config.build_settings["CODE_SIGN_ENTITLEMENTS"] = "App/App.entitlements"
                  config.build_settings["SKIP_INSTALL"] = "NO"
                else
                  # Bỏ cấu hình Profile riêng của các Plugins để xcodebuild tự động re-sign khi export
                  config.build_settings["ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES"] = "NO"
                  config.build_settings["SKIP_INSTALL"] = "YES"
                  config.build_settings.delete("PROVISIONING_PROFILE_SPECIFIER")
                  config.build_settings.delete("CODE_SIGN_IDENTITY")
                  config.build_settings.delete("CODE_SIGN_STYLE")
                  #config.build_settings["CODE_SIGNING_ALLOWED"] = "NO"
                  #config.build_settings["CODE_SIGNING_REQUIRED"] = "NO"
                end
              end
            end

            project.save
            puts "==> Cấu hình hoàn tất thành công!"
          else
            puts "==> LỖI: Không tìm thấy Target App!"
            exit 1
          end
          '
          
          # 3. Build Archive (Loại bỏ flag CODE_SIGNING_ALLOWED=NO để không nuốt mất Entitlements)
          xcodebuild -project ios/App/App.xcodeproj \
                     -scheme App \
                     -configuration Release \
                     -sdk iphoneos \
                     -archivePath build/App.xcarchive \
                     #CODE_SIGN_ENTITLEMENTS="App/App.entitlements" \
                     CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO \
                     ONLY_ACTIVE_ARCH=NO \
                     ARCHS="arm64" \
                     archive

          # 4. Export IPA (Xcode tự động nhúng Entitlements & re-sign toàn bộ App + Plugins)
          xcodebuild -exportArchive \
                     -archivePath build/App.xcarchive \
                     -exportOptionsPlist ExportOptions.plist \
                     -exportPath build/output

          # 5. Đảm bảo file .ipa đầu ra luôn mang tên App.ipa
          cd build/output
          IPA_FILE=$(ls *.ipa | head -n 1)
          if [ "$IPA_FILE" != "App.ipa" ]; then
            mv "$IPA_FILE" App.ipa
          fi

      # =========================================================================
      # 7. CHECK ENTITLEMENTS VÀ DUNG LƯỢNG
      # =========================================================================
      - name: Verify IPA
        run: |
          ls -lh build/output/App.ipa
          unzip -q build/output/App.ipa -d temp_ipa
          echo "==> ENTITLEMENTS TRONG BINARY:"
          codesign -d --entitlements :- temp_ipa/Payload/App.app
          rm -rf temp_ipa

      # =========================================================================
      # 8. UPLOAD IPA LÊN GITHUB ARTIFACTS & TESTFLIGHT
      # =========================================================================
      - name: Upload IPA to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-signed-app
          path: build/output/App.ipa
          retention-days: 7

