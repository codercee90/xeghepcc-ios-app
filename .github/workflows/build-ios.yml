name: Build iOS App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24  # Khuyên dùng Node 20 LTS để ổn định nhất với Capacitor CLI
          cache: 'npm'

      - name: Install NPM Dependencies & Plugins
        run: |
          npm install
          npm install @capacitor-community/background-geolocation --save
          npm install @capacitor-firebase/messaging --save

      - name: Build Web App
        run: npm run build --if-present

      # 1. Tạo file GoogleService-Info.plist từ GitHub Secrets
      - name: Create GoogleService-Info.plist
        run: |
          mkdir -p ios/App/App
          echo "${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}" > ios/App/App/GoogleService-Info.plist

      # 2. Đồng bộ Capacitor & Cài đặt Native Pods
      - name: Capacitor Sync iOS
        run: |
          npx cap add ios || true
          npx cap sync ios

      # =========================================================================
      # TỰ ĐỘNG CẬP NHẬT VERSION VÀ BUILD NUMBER
      # =========================================================================
      - name: Update Version and Build Number
        run: |
          cd ios/App
          # Đổi số Version hiển thị cho người dùng (Thay "1.0.1" thành phiên bản bạn muốn)
          xcrun agvtool new-marketing-version "1.8"
          
          # Tự động gán số Build Number theo số lần chạy workflow trên GitHub (1, 2, 3,...)
          xcrun agvtool new-version -all "${{ github.run_number }}"
          cd ../..

      # 3. Build Xcode Binary
      - name: Build Xcode App
        run: |
          xcodebuild -project ios/App/App.xcodeproj \
                     -scheme App \
                     -configuration Release \
                     -sdk iphoneos \
                     -derivedDataPath build \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     DISABLE_EXTRA_APP_PLIST_ENTITLEMENTS=YES

      # 4. ĐÓNG GÓI IPA (INJECT TRỰC TIẾP FILE PLIST VÀO APP BUNDLE)
      - name: Create Clean IPA Package
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/App.app Payload/
          
          # ÉP COPY FILE PLIST TRỰC TIẾP VÀO BUNDLE NATIVE
          cp ios/App/App/GoogleService-Info.plist Payload/App.app/GoogleService-Info.plist
          
          # Xóa signature rác để 3uTools/codesign ký lại từ đầu
          rm -rf Payload/App.app/_CodeSignature
          
          zip -r App-unsigned.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-unsigned
          path: App-unsigned.ipa
          retention-days: 7

      # =========================================================================
      # 5. CÀI ĐẶT CERTIFICATE (.p12) VÀ PROVISIONING PROFILE VÀO MACOS RUNNER
      # =========================================================================
      - name: Install Certificate and Provisioning Profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/embedded.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          # Giải mã file từ Base64
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode > $CERTIFICATE_PATH
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode > $PP_PATH

          # Tạo Keychain tạm
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 3600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # TẢI VÀ NHẬP CHỨNG CHỈ TRUNG GIAN CỦA APPLE (WWDR G3/G6) ĐỂ XÁC THỰC CERTIFICATE
          curl -fL https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer -o $RUNNER_TEMP/AppleWWDRCAG3.cer
          curl -fL https://www.apple.com/certificateauthority/AppleWWDRCAG6.cer -o $RUNNER_TEMP/AppleWWDRCAG6.cer
          security import $RUNNER_TEMP/AppleWWDRCAG3.cer -k $KEYCHAIN_PATH
          security import $RUNNER_TEMP/AppleWWDRCAG6.cer -k $KEYCHAIN_PATH

          # Import Cert .p12 vào Keychain
          security import $CERTIFICATE_PATH -k $KEYCHAIN_PATH -P "$P12_PASSWORD" -A -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychains -s $KEYCHAIN_PATH $(security list-keychains | xargs)

      # =========================================================================
      # 6. RESIGN IPA FILE WITH ROBUST DEEP SIGNING SCRIPT
      # =========================================================================
      - name: Resign IPA File
        run: |
          # Unzip the unsigned IPA
          unzip -q App-unsigned.ipa -d resigned_temp
          APP_PATH="resigned_temp/Payload/App.app"
          
          # 1. Embed the correct Provisioning Profile
          cp $RUNNER_TEMP/embedded.mobileprovision "$APP_PATH/embedded.mobileprovision"

          # 2. Extract full entitlements from the Provisioning Profile
          security cms -D -i $RUNNER_TEMP/embedded.mobileprovision > $RUNNER_TEMP/provision.plist
          /usr/libexec/PlistBuddy -x -c 'Print:Entitlements' $RUNNER_TEMP/provision.plist > $RUNNER_TEMP/entitlements.plist
          ENTITLEMENTS_FILE="$RUNNER_TEMP/entitlements.plist"

          # 3. Find the valid "Apple Distribution" certificate in the Keychain
          IDENTITY=$(security find-identity -v -p codesigning $RUNNER_TEMP/app-signing.keychain-db | grep "Apple Distribution" | head -n 1 | awk -F '"' '{print $2}')
          if [ -z "$IDENTITY" ]; then
            IDENTITY=$(security find-identity -v -p codesigning $RUNNER_TEMP/app-signing.keychain-db | head -n 1 | awk -F '"' '{print $2}')
          fi

          if [ -z "$IDENTITY" ]; then
            echo "Error: No valid signing identity found."
            exit 1
          fi

          echo "Signing with Identity: $IDENTITY"

          # 4. Remove all existing signatures to prevent conflicts
          find "$APP_PATH" -name "_CodeSignature" -exec rm -rf {} + 2>/dev/null || true

          # 5. DEFINE THE DEEP SIGNING SCRIPT
          cat > sign_item.sh << 'EOF'
          IDENTITY=$1
          KEYCHAIN=$2
          ENTITLEMENTS=$3
          ITEM=$4

          # Prevent infinite loops and only process what's necessary
          if [[ $ITEM == *".mobileprovision" ]] || [[ $ITEM == *".plist" ]] || [[ $ITEM == *"_CodeSignature" ]]; then
            return 0
          fi
          
          echo "Processing: $ITEM"
          
          # Recursively process children first for deep signing
          if [ -d "$ITEM" ]; then
            for child in "$ITEM"/*; do
              # Ensure there's a file to process (handle empty directories)
              [ -e "$child" ] && /bin/bash sign_item.sh "$IDENTITY" "$KEYCHAIN" "$ENTITLEMENTS" "$child"
            done
          fi

          # Function to apply the signature
          apply_signature() {
            local TARGET=$1
            local OPTS=$2
            echo "Applying signature to: $TARGET"
            /usr/bin/codesign --force --timestamp --sign "$IDENTITY" --keychain "$KEYCHAIN" $OPTS "$TARGET"
          }

          # Handle the primary signature for the item
          if [[ $ITEM == *.app ]]; then
            # Main app bundle gets specific entitlements
            apply_signature "$ITEM" "--entitlements $ENTITLEMENTS"
          elif [ -f "$ITEM" ] && [[ $ITEM == .dylib || $ITEM == *.framework || $ITEM == .appex || $ITEM == */PlugIns/ ]]; then
            # Frameworks, extensions, and dylibs get timestamped signatures
            apply_signature "$ITEM"
          elif [ -d "$ITEM" ] && [[ $ITEM == *.framework || $ITEM == *.appex ]]; then
            # Directory-based frameworks and extensions
            apply_signature "$ITEM"
          fi
          EOF

          # 6. EXECUTE THE SIGNING PROCESS
          chmod +x sign_item.sh
          /bin/bash sign_item.sh "$IDENTITY" "$RUNNER_TEMP/app-signing.keychain-db" "$ENTITLEMENTS_FILE" "$APP_PATH"

          # Clean up the script
          rm sign_item.sh

          # 7. Re-package the signed IPA
          cd resigned_temp
          zip -qr ../App-signed.ipa Payload
          cd ..

      # =========================================================================
      # 7. UPLOAD BẢN BUILD LÊN TESTFLIGHT VỚI ALTOOL
      # =========================================================================
      - name: Upload IPA to TestFlight
        env:
          APP_PASSWORD: ${{ secrets.APP_SPECIFIC_PASSWORD }}
        run: |
          xcrun altool --upload-app \
            --type ios \
            --file "App-signed.ipa" \
            --username "codercee@gmail.com" \
            --password "$APP_PASSWORD"

      # =========================================================================
      # 7. TẢI FILE IPA ĐÃ KÝ (SIGNED) LÊN ARTIFACTS ĐỂ DOWNLOAD
      # =========================================================================
#      - name: Upload Signed IPA Artifact
#        uses: actions/upload-artifact@v4
