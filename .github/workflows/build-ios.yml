name: Build and Upload iOS App to TestFlight

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: macos-latest

    steps:
      # =========================================================================
      # 1. CHECKOUT SOURCE CODE
      # =========================================================================
      - name: Checkout Repository
        uses: actions/checkout@v4

      # =========================================================================
      # 2. SETUP NODE.JS & INSTALL DEPENDENCIES
      # =========================================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node_version: '24'

      - name: Install NPM Dependencies & Plugins
        run: |
          npm ci || npm install
          npm install @capacitor-community/background-geolocation @capacitor-firebase/messaging --save || true

      - name: Build Web App
        run: npm run build --if-present

      - name: Create GoogleService-Info.plist
        run: |
          mkdir -p ios/App/App
          echo "${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}" > ios/App/App/GoogleService-Info.plist

      - name: Capacitor Sync iOS
        run: |
          npx cap add ios || true
          npx cap sync ios

      # =========================================================================
      # TỰ ĐỘNG BỎ QUA XÁC NHẬN MISSING COMPLIANCE
      # (Đã di chuyển xuống sau bước Capacitor Sync để tránh bị đè lại)
      # =========================================================================
      - name: Add Export Compliance Flag to Info.plist
        run: |
          PLIST_PATH="ios/App/App/Info.plist"
          if [ -f "$PLIST_PATH" ]; then
            /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST_PATH" || \
            /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" "$PLIST_PATH"
          fi

      # =========================================================================
      # 3. TỰ ĐỘNG CẬP NHẬT VERSION VÀ BUILD NUMBER
      # =========================================================================
      - name: Update Version and Build Number
        run: |
          cd ios/App
          xcrun agvtool new-marketing-version "1.9"
          xcrun agvtool new-version -all "${{ github.run_number }}"
          cd ../..

      # =========================================================================
      # 4. IMPORT CERTIFICATE (.P12) AND PROVISIONING PROFILE
      # =========================================================================
      - name: Install Certificate and Provisioning Profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/embedded.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode > $CERTIFICATE_PATH
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode > $PP_PATH

          PP_UUID=$(security cms -D -i $PP_PATH | xmllint --xpath '//key[text()="UUID"]/following-sibling::string[1]/text()' -)
          PP_NAME=$(security cms -D -i $PP_PATH | xmllint --xpath '//key[text()="Name"]/following-sibling::string[1]/text()' -)
          
          echo "PP_UUID=$PP_UUID" >> $GITHUB_ENV
          echo "PP_NAME=$PP_NAME" >> $GITHUB_ENV

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/$PP_UUID.mobileprovision

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 3600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          curl -fL https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer -o $RUNNER_TEMP/AppleWWDRCAG3.cer
          security import $RUNNER_TEMP/AppleWWDRCAG3.cer -k $KEYCHAIN_PATH

          security import $CERTIFICATE_PATH -k $KEYCHAIN_PATH -P "$P12_PASSWORD" -A -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security default-keychain -s $KEYCHAIN_PATH

      # =========================================================================
      # 5. TẠO FILE EXPORTOPTIONS.PLIST ĐỂ XUẤT IPA
      # =========================================================================
      - name: Create ExportOptions.plist
        run: |
          BUNDLE_ID="cc.xeghep.www.ios" 

          python3 -c "
          import plistlib

          data = {
              'method': 'app-store-connect',
              'destination': 'export',
              'signingStyle': 'manual',
              'signingCertificate': 'Apple Distribution',
              'provisioningProfiles': {
                  '${BUNDLE_ID}': '${PP_NAME}'
              },
              'stripSwiftSymbols': True,
              'uploadSymbols': True,
              'teamID': 'HK58UX9N3D'
          }

          with open('ExportOptions.plist', 'wb') as f:
              plistlib.dump(data, f)
          "

      # =========================================================================
      # 6. BUILD ARCHIVE VÀ EXPORT FILE IPA (FIX TRIỆT ĐỂ BẰNG XCCONFIG)
      # =========================================================================
      - name: Build and Export IPA
        run: |
          # 1. Tạo file overrides.xcconfig để ép buộc quy tắc signing
          cat <<'EOF' > overrides.xcconfig
          // Reset cấu hình mặc định cho tất cả các target
          CODE_SIGN_STYLE = Automatic
          PROVISIONING_PROFILE_SPECIFIER =
          
          // Chỉ áp dụng Manual signing và Profile XeGhep cho target App chính
          CODE_SIGN_STYLE[sdk=iphoneos*][target=App] = Manual
          DEVELOPMENT_TEAM[sdk=iphoneos*][target=App] = HK58UX9N3D
          CODE_SIGN_IDENTITY[sdk=iphoneos*][target=App] = Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*][target=App] = XeGhep
          EOF

          # 2. Archive ứng dụng sử dụng file cấu hình overrides
          xcodebuild -project ios/App/App.xcodeproj \
                     -scheme App \
                     -configuration Release \
                     -sdk iphoneos \
                     -archivePath build/App.xcarchive \
                     -xcconfig overrides.xcconfig \
                     archive

          # 3. Export ra file .ipa chuẩn
          xcodebuild -exportArchive \
                     -archivePath build/App.xcarchive \
                     -exportOptionsPlist ExportOptions.plist \
                     -exportPath build/output

      # =========================================================================
      # 7. UPLOAD IPA LÊN GITHUB ARTIFACTS
      # =========================================================================
      - name: Upload IPA to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-signed-app
          path: build/output/*.ipa
          retention-days: 7

      # =========================================================================
      # 8. UPLOAD IPA LÊN TESTFLIGHT VIA ALTOOL
      # =========================================================================
      - name: Upload IPA to TestFlight
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APP_PASSWORD: ${{ secrets.APP_SPECIFIC_PASSWORD }}
        run: |
          IPA_PATH=$(find build/output -name "*.ipa" | head -n 1)
          
          echo "Uploading $IPA_PATH to TestFlight..."
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --username "$APPLE_ID" \
            --password "$APP_PASSWORD"

      # =========================================================================
      # 8. UPLOAD IPA LÊN TESTFLIGHT (Sử dụng Action chuẩn hiện đại)
      # =========================================================================
#      - name: Upload IPA to TestFlight
#        uses: apple-actions/upload-testflight-build@v1
