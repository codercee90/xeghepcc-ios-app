name: Build and Upload iOS App to TestFlight

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: macos-latest

    steps:
      # =========================================================================
      # 1. CHECKOUT SOURCE CODE
      # =========================================================================
      - name: Checkout Repository
        uses: actions/checkout@v4

      # =========================================================================
      # 2. SETUP NODE.JS & INSTALL DEPENDENCIES
      # =========================================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node_version: '24'

      - name: Install NPM Dependencies & Plugins
        run: |
          npm ci || npm install
          npm install @capacitor-community/background-geolocation @capacitor-firebase/messaging --save || true

      - name: Build Web App
        run: npm run build --if-present

      - name: Create GoogleService-Info.plist
        run: |
          mkdir -p ios/App/App
          echo "${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}" > ios/App/App/GoogleService-Info.plist

      - name: Capacitor Sync iOS
        run: |
          npx cap add ios || true
          npx cap sync ios

      # =========================================================================
      # 3. TỰ ĐỘNG CẬP NHẬT VERSION VÀ BUILD NUMBER
      # =========================================================================
      - name: Update Version and Build Number
        run: |
          cd ios/App
          # Cập nhật Marketing Version
          xcrun agvtool new-marketing-version "1.8"
          
          # Tự động gán Build Number theo số lần chạy workflow trên GitHub
          xcrun agvtool new-version -all "${{ github.run_number }}"
          cd ../..

      # =========================================================================
      # 4. IMPORT CERTIFICATE (.P12) AND PROVISIONING PROFILE
      # =========================================================================
      - name: Install Certificate and Provisioning Profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/embedded.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          # Decode Base64 thành file nhị phân
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode > $CERTIFICATE_PATH
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode > $PP_PATH

          # Extract UUID & Name của Provisioning Profile để dùng ở bước sau nếu cần
          PP_UUID=$(security cms -D -i $PP_PATH | xmllint --xpath '//key[text()="UUID"]/following-sibling::string[1]/text()' -)
          PP_NAME=$(security cms -D -i $PP_PATH | xmllint --xpath '//key[text()="Name"]/following-sibling::string[1]/text()' -)
          
          # Xuất UUID & Name ra environment variable
          echo "PP_UUID=$PP_UUID" >> $GITHUB_ENV
          echo "PP_NAME=$PP_NAME" >> $GITHUB_ENV

          # Copy Profile vào thư mục hệ thống mặc định của macOS Runner
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/$PP_UUID.mobileprovision

          # Tạo Keychain tạm thời
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 3600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Import Apple WWDR Certificates (Root CA)
          curl -fL https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer -o $RUNNER_TEMP/AppleWWDRCAG3.cer
          security import $RUNNER_TEMP/AppleWWDRCAG3.cer -k $KEYCHAIN_PATH

          # Import file .p12 vào Keychain
          security import $CERTIFICATE_PATH -k $KEYCHAIN_PATH -P "$P12_PASSWORD" -A -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security default-keychain -s $KEYCHAIN_PATH

      # =========================================================================
      # 5. TẠO FILE EXPORTOPTIONS.PLIST ĐỂ XUẤT IPA
      # =========================================================================
      - name: Create ExportOptions.plist
        run: |
          # Bắt buộc thay "com.yourcompany.yourapp" bằng đúng Bundle Identifier của app bạn
          BUNDLE_ID="cc.xeghep.www.ios" 

          cat <<EOF > ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>signingCertificate</key>
              <string>Apple Distribution</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>${BUNDLE_ID}</key>
                  <string>${PP_NAME}</string>
              </dict>
              <key>stripSwiftSymbols</key>
              <true/>
              <key>uploadSymbols</key>
              <true/>
              <key>teamID</key>
              <string>HK58UX9N3D</string>
          </dict>
          EOF

      # =========================================================================
      # 6. BUILD ARCHIVE VÀ EXPORT FILE IPA ĐÚNG CHUẨN XCODE
      # =========================================================================
      - name: Build and Export IPA
        run: |
          # Bước A: Archive ứng dụng (chỉ chỉ định cho target chính 'App', không ép profile lên các dependencies)
          xcodebuild -project ios/App/App.xcodeproj \
                     -scheme App \
                     -configuration Release \
                     -sdk iphoneos \
                     -archivePath build/App.xcarchive \
                     CODE_SIGNING_ALLOWED=NO \
                     archive

          # Bước B: Export ra file .ipa chuẩn (bước này sẽ tự ký code chuẩn xác bằng ExportOptions.plist)
          xcodebuild -exportArchive \
                     -archivePath build/App.xcarchive \
                     -exportOptionsPlist ExportOptions.plist \
                     -exportPath build/output

      # =========================================================================
      # 7. UPLOAD IPA LÊN GITHUB ARTIFACTS
      # =========================================================================
      - name: Upload IPA to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-signed-app
          path: build/output/*.ipa
          retention-days: 7

      # =========================================================================
      # 8. UPLOAD IPA LÊN TESTFLIGHT VIA ALTOOL
      # =========================================================================
      - name: Upload IPA to TestFlight
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APP_PASSWORD: ${{ secrets.APP_SPECIFIC_PASSWORD }}
        run: |
          IPA_PATH=$(find build/output -name "*.ipa" | head -n 1)
          
          echo "Uploading $IPA_PATH to TestFlight..."
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --username "$APPLE_ID" \
            --password "$APP_PASSWORD"

      # =========================================================================
      # 8. UPLOAD IPA LÊN TESTFLIGHT (Sử dụng Action chuẩn hiện đại)
      # =========================================================================
#      - name: Upload IPA to TestFlight
#        uses: apple-actions/upload-testflight-build@v1
#        with:
#          app-path: 'build/output/App.ipa' # Hoặc file .ipa xuất ra trong folder build/output
#          issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
#          api-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
#          api-private-key: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
