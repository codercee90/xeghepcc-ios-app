name: Build iOS App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install NPM Dependencies & Plugins
        run: |
          npm ci
          npm install @capacitor-community/background-geolocation --save
          npm install @capacitor-firebase/messaging --save

      - name: Build Web App
        run: npm run build --if-present

      # 1. Tự động ghi file GoogleService-Info.plist từ GitHub Secrets
      - name: Create GoogleService-Info.plist
        run: |
          echo "${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}" > ios/App/App/GoogleService-Info.plist

      # 2. Đồng bộ Capacitor chuẩn (Để Capacitor tự sinh Podfile/SPM đúng chuẩn)
      - name: Capacitor Sync iOS
        run: |
          npx cap add ios || true
          npx cap sync ios

      # 3. Chèn cấu hình static linkage vào Podfile nếu dự án dùng Pods
      - name: Configure Static Frameworks & Install Pods
        run: |
          cd ios/App
          if [ -f "Podfile" ]; then
            # Thêm dòng use_frameworks! :linkage => :static vào đầu Podfile nếu chưa có
            sed -i '' '1s/^/use_frameworks! :linkage => :static\n/' Podfile || true
            pod install --repo-update || true
          fi

      # 4. Build Xcode Binary (Cấu hình chuẩn cho Sideload / 3uTools)
      - name: Build Xcode App
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace \
                     -scheme App \
                     -configuration Release \
                     -sdk iphoneos \
                     -derivedDataPath build \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     DISABLE_EXTRA_APP_PLIST_ENTITLEMENTS=YES

      # 5. Đóng gói IPA chuẩn tương thích 100% với 3uTools / AltStore
      - name: Create Clean IPA Package
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/App.app Payload/
          
          # Xóa signature rác để 3uTools ký lại từ đầu sạch sẽ
          rm -rf Payload/App.app/_CodeSignature
          
          zip -r App-unsigned.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-unsigned
          path: App-unsigned.ipa
          retention-days: 7
