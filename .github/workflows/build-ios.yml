name: Build iOS App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install NPM Dependencies & Plugins
        run: |
          npm install
          npm install @capacitor-community/background-geolocation --save
          npm install @capacitor-firebase/messaging --save

      - name: Build Web App
        run: npm run build --if-present

      # 1. Tạo file GoogleService-Info.plist từ GitHub Secrets
      - name: Create GoogleService-Info.plist
        run: |
          mkdir -p ios/App/App
          echo "${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}" > ios/App/App/GoogleService-Info.plist

      # 2. Đồng bộ Capacitor & Cài đặt Native Pods
      - name: Capacitor Sync iOS
        run: |
          npx cap add ios || true
          npx cap sync ios

      # =========================================================================
      # TỰ ĐỘNG CẬP NHẬT VERSION VÀ BUILD NUMBER
      # =========================================================================
      - name: Update Version and Build Number
        run: |
          cd ios/App
          xcrun agvtool new-marketing-version "1.8"
          xcrun agvtool new-version -all "${{ github.run_number }}"
          cd ../..

      # 3. Build Xcode Binary
      - name: Build Xcode App
        run: |
          xcodebuild -project ios/App/App.xcodeproj \
                     -scheme App \
                     -configuration Release \
                     -sdk iphoneos \
                     -derivedDataPath build \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     DISABLE_EXTRA_APP_PLIST_ENTITLEMENTS=YES

      # 4. ĐÓNG GÓI IPA (INJECT TRỰC TIẾP FILE PLIST VÀO APP BUNDLE)
      - name: Create Clean IPA Package
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/App.app Payload/
          cp ios/App/App/GoogleService-Info.plist Payload/App.app/GoogleService-Info.plist
          rm -rf Payload/App.app/_CodeSignature
          zip -r App-unsigned.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-unsigned
          path: App-unsigned.ipa
          retention-days: 7

      # =========================================================================
      # 5. CÀI ĐẶT CERTIFICATE, APPLE WWDR CA VÀ PROVISIONING PROFILE
      # =========================================================================
      - name: Install Certificate and Provisioning Profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/embedded.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          # 解码 Base64
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode > $CERTIFICATE_PATH
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode > $PP_PATH

          # Tạo Keychain tạm
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 3600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Tải và cài đặt Apple Intermediate Certificates (Bắt buộc để chứng chỉ .p12 được Trust)
          curl -fL https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer -o $RUNNER_TEMP/AppleWWDRCAG3.cer
          curl -fL https://www.apple.com/certificateauthority/AppleWWDRCAG6.cer -o $RUNNER_TEMP/AppleWWDRCAG6.cer
          security import $RUNNER_TEMP/AppleWWDRCAG3.cer -k $KEYCHAIN_PATH
          security import $RUNNER_TEMP/AppleWWDRCAG6.cer -k $KEYCHAIN_PATH

          # Import Cert .p12 vào Keychain
          security import $CERTIFICATE_PATH -k $KEYCHAIN_PATH -P "$P12_PASSWORD" -A -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychains -s $KEYCHAIN_PATH $(security list-keychains | xargs)

      # =========================================================================
      # 6. KÝ LẠI FILE IPA (SỬ DỤNG IDENTITY CHUẨN ĐƯỢC TẢI TỪ P12)
      # =========================================================================
      - name: Resign IPA File
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          
          # 1. Tìm chính xác Name Identity vừa tạo trong Keychain từ file p12
          IDENTITY=$(security find-identity -v -p codesigning $KEYCHAIN_PATH | grep -E "Apple Distribution|iPhone Distribution|Apple Development" | head -n 1 | awk -F '"' '{print $2}')
          if [ -z "$IDENTITY" ]; then
            IDENTITY=$(security find-identity -v -p codesigning $KEYCHAIN_PATH | grep -v "0 valid identities found" | head -n 1 | awk -F '"' '{print $2}')
          fi

          echo "Detected Signing Identity: [$IDENTITY]"

          # 2. Giải nén IPA
          unzip -q App-unsigned.ipa -d resigned_temp
          APP_PATH="resigned_temp/Payload/App.app"
          
          # 3. Đưa Provisioning Profile mới vào trong app
          cp $RUNNER_TEMP/embedded.mobileprovision "$APP_PATH/embedded.mobileprovision"

          # 4. Trích xuất chính xác Entitlements từ Provisioning Profile
          security cms -D -i $RUNNER_TEMP/embedded.mobileprovision > $RUNNER_TEMP/provision.plist
          /usr/libexec/PlistBuddy -x -c 'Print:Entitlements' $RUNNER_TEMP/provision.plist > $RUNNER_TEMP/entitlements.plist
          ENTITLEMENTS_FILE="$RUNNER_TEMP/entitlements.plist"

          # 5. Ký tất cả các Frameworks/SPM con bên trong
          if [ -d "$APP_PATH/Frameworks" ]; then
            find "$APP_PATH/Frameworks" -mindepth 1 -maxdepth 1 | while read framework; do
              echo "Signing Framework: $framework"
              /usr/bin/codesign --force --sign "$IDENTITY" --keychain $KEYCHAIN_PATH "$framework"
            done
          fi

          # 6. Ký tất cả App Extensions (nếu có)
          if [ -d "$APP_PATH/PlugIns" ]; then
            find "$APP_PATH/PlugIns" -mindepth 1 -maxdepth 1 | while read plugin; do
              echo "Signing App Extension: $plugin"
              /usr/bin/codesign --force --sign "$IDENTITY" --keychain $KEYCHAIN_PATH "$plugin"
            done
          fi

          # 7. Ký lại gói App chính
          /usr/bin/codesign --force --sign "$IDENTITY" --entitlements "$ENTITLEMENTS_FILE" --keychain $KEYCHAIN_PATH "$APP_PATH"

          # Nén lại thành file IPA hoàn chỉnh
          cd resigned_temp
          zip -qr ../App-signed.ipa Payload
          cd ..

      # =========================================================================
      # 7. TẢI FILE IPA ĐÃ KÝ LÊN ARTIFACTS
      # =========================================================================
      - name: Upload Signed IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-signed
          path: App-signed.ipa
          retention-days: 7
