name: Build and Upload iOS App to TestFlight

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install NPM Dependencies & Plugins
        run: |
          npm install
          npm install @capacitor-community/background-geolocation --save
          npm install @capacitor-firebase/messaging --save

      - name: Build Web App
        run: npm run build --if-present

      # 1. Tạo file GoogleService-Info.plist từ GitHub Secrets
      - name: Create GoogleService-Info.plist
        run: |
          mkdir -p ios/App/App
          echo "${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}" > ios/App/App/GoogleService-Info.plist

      # 2. Đồng bộ Capacitor & Cài đặt Native Pods
      - name: Capacitor Sync iOS
        run: |
          npx cap add ios || true
          npx cap sync ios

      # 3. Tự động cập nhật Version và Build Number
      - name: Update Version and Build Number
        run: |
          cd ios/App
          xcrun agvtool new-marketing-version "1.8"
          xcrun agvtool new-version -all "${{ github.run_number }}"
          cd ../..

      # =========================================================================
      # 4. CÀI ĐẶT CERTIFICATE (.p12) VÀ PROVISIONING PROFILE VÀO MACOS RUNNER
      # =========================================================================
      - name: Install Certificate and Provisioning Profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/embedded.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          # 解码 Base64
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode > $CERTIFICATE_PATH
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode > $PP_PATH

          # Copy Provisioning Profile vào đúng vị trí hệ thống Xcode bắt buộc tìm
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/

          # Tạo & Cấu hình Keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 3600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Import Certs
          curl -fL https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer -o $RUNNER_TEMP/AppleWWDRCAG3.cer
          curl -fL https://www.apple.com/certificateauthority/AppleWWDRCAG6.cer -o $RUNNER_TEMP/AppleWWDRCAG6.cer
          security import $RUNNER_TEMP/AppleWWDRCAG3.cer -k $KEYCHAIN_PATH
          security import $RUNNER_TEMP/AppleWWDRCAG6.cer -k $KEYCHAIN_PATH

          security import $CERTIFICATE_PATH -k $KEYCHAIN_PATH -P "$P12_PASSWORD" -A -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychains -s $KEYCHAIN_PATH $(security list-keychains | xargs)

      # =========================================================================
      # 5. BUILD XCODE ARCHIVE (TẮT SIGNING ĐỂ TRÁNH LỖI DEPENDENCIES)
      # =========================================================================
      - name: Build Xcode App Archive
        run: |
          xcodebuild -project ios/App/App.xcodeproj \
                     -scheme App \
                     -configuration Release \
                     -sdk iphoneos \
                     -derivedDataPath build \
                     -archivePath build/App.xcarchive \
                     archive \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY=""

      # =========================================================================
      # 6. ĐÓNG GÓI VÀ KÝ CHUẨN DEEP RE-SIGN
      # =========================================================================
      - name: Create Perfectly Signed IPA Package
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          # Unlock keychain một lần nữa để chắc chắn
          security unlock-keychain -p "${{ secrets.KEYCHAIN_PASSWORD }}" $KEYCHAIN_PATH

          # 1. Chuẩn bị thư mục Payload
          rm -rf Payload App-signed.ipa
          mkdir -p Payload
          cp -r build/App.xcarchive/Products/Applications/App.app Payload/
          APP_PATH="Payload/App.app"

          # 2. Xóa sạch 100% chữ ký cũ và file rác
          find "$APP_PATH" -name "_CodeSignature" -exec rm -rf {} + || true
          find "$APP_PATH" -name "*.DS_Store" -exec rm -rf {} + || true

          # 3. Inject GoogleService-Info.plist & Provisioning Profile
          cp ios/App/App/GoogleService-Info.plist "$APP_PATH/GoogleService-Info.plist" || true
          cp $RUNNER_TEMP/embedded.mobileprovision "$APP_PATH/embedded.mobileprovision"

          # 4. Trích xuất Entitlements
          security cms -D -i $RUNNER_TEMP/embedded.mobileprovision > $RUNNER_TEMP/provision.plist
          /usr/libexec/PlistBuddy -x -c 'Print:Entitlements' $RUNNER_TEMP/provision.plist > $RUNNER_TEMP/entitlements.plist

          # 5. LẤY IDENTITY AN TOÀN TRONG KEYCHAIN (Bao gồm cả mã HEX Hash)
          IDENTITY=$(security find-identity -v -p codesigning $KEYCHAIN_PATH | grep -E "Valid identities|Matching identities" -A 5 | grep -E "\)" | head -n 1 | awk -F '"' '{print $2}')
          
          # Nếu lấy bằng tên thất bại, lấy bằng SHA-1 Hash
          if [ -z "$IDENTITY" ]; then
            IDENTITY=$(security find-identity -v -p codesigning $KEYCHAIN_PATH | grep -E "1\)" | awk '{print $2}')
          fi

          echo "Found Identity: $IDENTITY"

          # 6. KÝ TỪ TRONG RA NGOÀI (RECURSIVE INSIDE-OUT)
          # Step A: Frameworks
          if [ -d "$APP_PATH/Frameworks" ]; then
            for fw in "$APP_PATH/Frameworks"/*; do
              if [ -d "$fw" ] || [ -f "$fw" ]; then
                echo "--> Signing Framework: $fw"
                /usr/bin/codesign --force --sign "$IDENTITY" \
                  --timestamp \
                  --keychain $KEYCHAIN_PATH \
                  "$fw"
              fi
            done
          fi

          # Step B: Extensions
          if [ -d "$APP_PATH/PlugIns" ]; then
            for plugin in "$APP_PATH/PlugIns"/*; do
              if [ -d "$plugin" ]; then
                echo "--> Signing Plugin: $plugin"
                /usr/bin/codesign --force --sign "$IDENTITY" \
                  --timestamp \
                  --keychain $KEYCHAIN_PATH \
                  "$plugin"
              fi
            done
          fi

          # Step C: Main App Bundle
          echo "--> Signing Main App Bundle: $APP_PATH"
          /usr/bin/codesign --force --sign "$IDENTITY" \
            --entitlements $RUNNER_TEMP/entitlements.plist \
            --timestamp \
            --keychain $KEYCHAIN_PATH \
            "$APP_PATH"

          # 7. Kiểm tra tính hợp lệ
          echo "Verifying Code Signature..."
          /usr/bin/codesign --verify --verbose=4 "$APP_PATH"

          # 8. Đóng gói IPA
          zip -qr App-signed.ipa Payload

      # =========================================================================
      # 7. UPLOAD IPA LÊN TESTFLIGHT
      # =========================================================================
      - name: Upload IPA to TestFlight
        env:
          APP_PASSWORD: ${{ secrets.APP_SPECIFIC_PASSWORD }}
        run: |
          xcrun altool --upload-app \
            --type ios \
            --file "App-signed.ipa" \
            --username "codercee@gmail.com" \
            --password "$APP_PASSWORD"
