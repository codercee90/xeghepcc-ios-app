name: Build and Upload iOS App to TestFlight

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install NPM Dependencies & Plugins
        run: |
          npm install
          npm install @capacitor-community/background-geolocation --save
          npm install @capacitor-firebase/messaging --save

      - name: Build Web App
        run: npm run build --if-present

      # 1. Tạo file GoogleService-Info.plist từ GitHub Secrets
      - name: Create GoogleService-Info.plist
        run: |
          mkdir -p ios/App/App
          echo "${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}" > ios/App/App/GoogleService-Info.plist

      # 2. Đồng bộ Capacitor & Cài đặt Native Pods
      - name: Capacitor Sync iOS
        run: |
          npx cap add ios || true
          npx cap sync ios

      # 3. Tự động cập nhật Version và Build Number
      - name: Update Version and Build Number
        run: |
          cd ios/App
          xcrun agvtool new-marketing-version "1.8"
          xcrun agvtool new-version -all "${{ github.run_number }}"
          cd ../..

      # =========================================================================
      # 4. CÀI ĐẶT CERTIFICATE (.p12) VÀ PROVISIONING PROFILE VÀO MACOS RUNNER
      # =========================================================================
      - name: Install Certificate and Provisioning Profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/embedded.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          # Giải mã file từ Base64
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode > $CERTIFICATE_PATH
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode > $PP_PATH

          # Tạo Keychain tạm
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 3600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Cài đặt chứng chỉ trung gian của Apple (WWDR)
          curl -fL https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer -o $RUNNER_TEMP/AppleWWDRCAG3.cer
          curl -fL https://www.apple.com/certificateauthority/AppleWWDRCAG6.cer -o $RUNNER_TEMP/AppleWWDRCAG6.cer
          security import $RUNNER_TEMP/AppleWWDRCAG3.cer -k $KEYCHAIN_PATH
          security import $RUNNER_TEMP/AppleWWDRCAG6.cer -k $KEYCHAIN_PATH

          # Import Cert .p12 vào Keychain
          security import $CERTIFICATE_PATH -k $KEYCHAIN_PATH -P "$P12_PASSWORD" -A -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychains -s $KEYCHAIN_PATH $(security list-keychains | xargs)

      # =========================================================================
      # 5. BUILD XCODE ARCHIVE (BỎ QUA KÝ CÁC GÓI PHỤ SPM)
      # =========================================================================
      - name: Build Xcode App Archive
        run: |
          xcodebuild -project ios/App/App.xcodeproj \
                     -scheme App \
                     -configuration Release \
                     -sdk iphoneos \
                     -derivedDataPath build \
                     -archivePath build/App.xcarchive \
                     archive \
                     CODE_SIGN_STYLE="Manual" \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     PROVISIONING_PROFILE_SPECIFIER=""

      # =========================================================================
      # 6. ĐÓNG GÓI VÀ KÝ CHUẨN ĐỊNH DẠNG TỪNG FRAMEWORK (FIX LỖI 90034)
      # =========================================================================
      - name: Create Signed IPA Package
        run: |
          mkdir -p Payload
          cp -r build/App.xcarchive/Products/Applications/App.app Payload/
          
          APP_PATH="Payload/App.app"

          # 1. Chèn GoogleService-Info.plist và Provisioning Profile chuẩn vào bundle
          cp ios/App/App/GoogleService-Info.plist "$APP_PATH/GoogleService-Info.plist"
          cp $RUNNER_TEMP/embedded.mobileprovision "$APP_PATH/embedded.mobileprovision"

          # 2. Trích xuất chính xác Entitlements từ Provisioning Profile
          security cms -D -i $RUNNER_TEMP/embedded.mobileprovision > $RUNNER_TEMP/provision.plist
          /usr/libexec/PlistBuddy -x -c 'Print:Entitlements' $RUNNER_TEMP/provision.plist > $RUNNER_TEMP/entitlements.plist

          # 3. Lấy tên Chứng chỉ Distribution trong Keychain
          IDENTITY=$(security find-identity -v -p codesigning $RUNNER_TEMP/app-signing.keychain-db | grep "Apple Distribution" | head -n 1 | awk -F '"' '{print $2}')
          if [ -z "$IDENTITY" ]; then
            IDENTITY=$(security find-identity -v -p codesigning $RUNNER_TEMP/app-signing.keychain-db | head -n 1 | awk -F '"' '{print $2}')
          fi

          echo "Signing with Identity: $IDENTITY"

          # 4. KÝ TRỰC TIẾP TẤT CẢ FRAMEWORKS VÀ DYLIB BÊN TRONG (FIX LỖI 90034)
          if [ -d "$APP_PATH/Frameworks" ]; then
            find "$APP_PATH/Frameworks" -type f \( -name ".dylib" -o -name "Capacitor" -o -name "Cordova" \) -o -name ".framework" | while read fw; do
              echo "Re-signing Framework/Binary: $fw"
              /usr/bin/codesign --force --sign "$IDENTITY" \
                --preserve-metadata=identifier,entitlements,flags \
                --keychain $RUNNER_TEMP/app-signing.keychain-db \
                "$fw"
            done
          fi

          # 5. KÝ LẠI APP BUNDLE CHÍNH (GÁN ENTITLEMENTS)
          /usr/bin/codesign --force --sign "$IDENTITY" \
            --entitlements $RUNNER_TEMP/entitlements.plist \
            --keychain $RUNNER_TEMP/app-signing.keychain-db \
            "$APP_PATH"

          # 6. Nén lại thành file IPA
          zip -qr App-signed.ipa Payload

      # =========================================================================
      # 7. UPLOAD TRỰC TIẾP LÊN TESTFLIGHT VỚI ALTOOL
      # =========================================================================
      - name: Upload IPA to TestFlight
        env:
          APP_PASSWORD: ${{ secrets.APP_SPECIFIC_PASSWORD }}
        run: |
          xcrun altool --upload-app \
            --type ios \
            --file "App-signed.ipa" \
            --username "codercee@gmail.com" \
            --password "$APP_PASSWORD"
