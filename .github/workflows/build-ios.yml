name: Build and Upload iOS App to TestFlight

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: macos-latest

    steps:
      # =========================================================================
      # 1. CHECKOUT SOURCE CODE
      # =========================================================================
      - name: Checkout Repository
        uses: actions/checkout@v4

      # =========================================================================
      # 2. SETUP NODE.JS & INSTALL DEPENDENCIES
      # =========================================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node_version: '24'

      - name: Install NPM Dependencies & Plugins
        run: |
          npm install
          npm install @capacitor-community/background-geolocation --save || true
          npm install @capacitor-firebase/messaging --save || true

      - name: Build Web App
        run: npm run build --if-present

      - name: Create GoogleService-Info.plist
        run: |
          mkdir -p ios/App/App
          echo "${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}" > ios/App/App/GoogleService-Info.plist

      - name: Capacitor Sync iOS
        run: |
          npx cap add ios || true
          npx cap sync ios

      # =========================================================================
      # 3. TỰ ĐỘNG CẬP NHẬT VERSION VÀ BUILD NUMBER
      # =========================================================================
      - name: Update Version and Build Number
        run: |
          cd ios/App
          # Cập nhật Marketing Version (Ví dụ: 1.8)
          xcrun agvtool new-marketing-version "1.8"
          
          # Tự động gán Build Number theo số lần chạy workflow trên GitHub
          xcrun agvtool new-version -all "${{ github.run_number }}"
          cd ../..

      # =========================================================================
      # 4. IMPORT CERTIFICATE (.P12) AND PROVISIONING PROFILE INTO MACOS RUNNER
      # =========================================================================
      - name: Install Certificate and Provisioning Profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/embedded.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          # Decode Base64 thành file nhị phân
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode > $CERTIFICATE_PATH
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode > $PP_PATH

          # Copy Profile vào thư mục hệ thống mặc định của macOS
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/

          # Tạo Keychain tạm thời
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 3600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Import Apple WWDR Certificates (Root CA)
          curl -fL https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer -o $RUNNER_TEMP/AppleWWDRCAG3.cer
          curl -fL https://www.apple.com/certificateauthority/AppleWWDRCAG6.cer -o $RUNNER_TEMP/AppleWWDRCAG6.cer
          security import $RUNNER_TEMP/AppleWWDRCAG3.cer -k $KEYCHAIN_PATH
          security import $RUNNER_TEMP/AppleWWDRCAG6.cer -k $KEYCHAIN_PATH

          # Import file .p12 của bạn vào Keychain
          security import $CERTIFICATE_PATH -k $KEYCHAIN_PATH -P "$P12_PASSWORD" -A -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings $KEYCHAIN_PATH
          security default-keychain -s $KEYCHAIN_PATH

      # =========================================================================
      # 5. BƯỚC BUILD & ARCHIVE THÔ (TẮT HOÀN TOÀN TÍNH NĂNG KÝ MÃ)
      # =========================================================================
      - name: Build Xcode App Archive (Pure Build - No Signing)
        run: |
          xcodebuild -project ios/App/App.xcodeproj \
                     -scheme App \
                     -configuration Release \
                     -sdk iphoneos \
                     -derivedDataPath build \
                     -archivePath build/App.xcarchive \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     archive

      # =========================================================================
      # 6. BƯỚC KÝ MÃ (DEEP SIGNING) & ĐÓNG GÓI IPA SAU KHU BUILD XONG
      # =========================================================================
      - name: Deep Sign and Package IPA
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          # Unlock Keychain một lần nữa để đảm bảo quyền truy cập chìa khóa
          security unlock-keychain -p "${{ secrets.KEYCHAIN_PASSWORD }}" $KEYCHAIN_PATH

          # 1. Chuẩn bị thư mục chứa ứng dụng
          rm -rf Payload App-signed.ipa
          mkdir -p Payload
          cp -r build/App.xcarchive/Products/Applications/App.app Payload/
          APP_PATH="Payload/App.app"

          # 2. Xóa toàn bộ chữ ký cũ và file rác do bước Archive tạo ra
          find "$APP_PATH" -name "_CodeSignature" -exec rm -rf {} + || true
          find "$APP_PATH" -name "*.DS_Store" -exec rm -rf {} + || true

          # 3. Inject GoogleService-Info.plist & Provisioning Profile vào App
          cp ios/App/App/GoogleService-Info.plist "$APP_PATH/GoogleService-Info.plist" || true
          cp $RUNNER_TEMP/embedded.mobileprovision "$APP_PATH/embedded.mobileprovision"

          # 4. Trích xuất chính xác Entitlements từ Provisioning Profile
          security cms -D -i $RUNNER_TEMP/embedded.mobileprovision > $RUNNER_TEMP/provision.plist
          /usr/libexec/PlistBuddy -x -c 'Print:Entitlements' $RUNNER_TEMP/provision.plist > $RUNNER_TEMP/entitlements.plist

          # 5. Tự động lấy SHA-1 Hash / Identity của Certificate trong Keychain
          IDENTITY=$(security find-identity -v -p codesigning $KEYCHAIN_PATH | grep -E "Valid identities|Matching identities" -A 5 | grep -E "\)" | head -n 1 | awk -F '"' '{print $2}')
          if [ -z "$IDENTITY" ]; then
            IDENTITY=$(security find-identity -v -p codesigning $KEYCHAIN_PATH | grep -E "1\)" | awk '{print $2}')
          fi

          echo "Using Certificate Identity for Deep Signing: $IDENTITY"

          # 6. THỰC HIỆN KÝ TỪ TRONG RA NGOÀI (INSIDE-OUT RE-SIGNING)
          # Step A: Ký tất cả các Frameworks con (Capacitor, Cordova, Plugins)
          if [ -d "$APP_PATH/Frameworks" ]; then
            for fw in "$APP_PATH/Frameworks"/*; do
              if [ -d "$fw" ] || [ -f "$fw" ]; then
                echo "--> Signing Framework: $fw"
                /usr/bin/codesign --force --sign "$IDENTITY" \
                  --timestamp \
                  --keychain $KEYCHAIN_PATH \
                  "$fw"
              fi
            done
          fi

          # Step B: Ký App Extensions nếu có
          if [ -d "$APP_PATH/PlugIns" ]; then
            for plugin in "$APP_PATH/PlugIns"/*; do
              if [ -d "$plugin" ]; then
                echo "--> Signing Plugin: $plugin"
                /usr/bin/codesign --force --sign "$IDENTITY" \
                  --timestamp \
                  --keychain $KEYCHAIN_PATH \
                  "$plugin"
              fi
            done
          fi

          # Step C: Ký toàn bộ App chính với Entitlements chuẩn
          echo "--> Signing Main Application Bundle: $APP_PATH"
          /usr/bin/codesign --force --sign "$IDENTITY" \
            --entitlements $RUNNER_TEMP/entitlements.plist \
            --timestamp \
            --keychain $KEYCHAIN_PATH \
            "$APP_PATH"

          # 7. Kiểm tra độ hợp lệ của chữ ký
          echo "Verifying App Code Signature..."
          /usr/bin/codesign --verify --verbose=4 "$APP_PATH"

          # 8. Nén lại thành file IPA
          zip -qr App-signed.ipa Payload

      # =========================================================================
      # 6.5. UPLOAD IPA LÊN GITHUB ARTIFACTS (TẢI VỀ MÁY TÍNH)
      # =========================================================================
      - name: Upload IPA to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-signed-app    # Tên của file zip chứa artifact khi tải về
          path: App-signed.ipa         # Đường dẫn đến file IPA đã đóng gói ở Bước 6
          retention-days: 7            # Số ngày lưu trữ trên GitHub (mặc định 90 ngày, để 7 ngày cho tiết kiệm dung lượng)

      # =========================================================================
      # 7. UPLOAD IPA ĐÃ KÝ LÊN TESTFLIGHT
      # =========================================================================
      - name: Upload IPA to TestFlight
        env:
          APP_PASSWORD: ${{ secrets.APP_SPECIFIC_PASSWORD }}
        run: |
          xcrun altool --upload-app \
            --type ios \
            --file "App-signed.ipa" \
            --username "codercee@gmail.com" \
            --password "$APP_PASSWORD"
