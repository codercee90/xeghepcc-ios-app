name: Build Unsigned iOS IPA

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-unsigned:
    runs-on: macos-latest

    steps:
      # =========================================================================
      # 1. CHECKOUT SOURCE CODE
      # =========================================================================
      - name: Checkout Repository
        uses: actions/checkout@v4

      # =========================================================================
      # 2. SETUP NODE.JS & INSTALL DEPENDENCIES
      # =========================================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node_version: '24'

      - name: Install NPM Dependencies & Plugins
        run: |
          npm install
          npm install @capacitor-community/background-geolocation @capacitor-firebase/messaging --save || true

      - name: Create GoogleService-Info.plist
        run: |
          mkdir -p ios/App/App
          echo "${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}" > ios/App/App/GoogleService-Info.plist

      # Build Web Assets & Đồng bộ vào Capacitor iOS
      - name: Build Web App & Sync Capacitor
        run: |
          npm run build
          npx cap sync ios
          sed -i '' -e 's/\.v15/\.v15/g' ios/App/CapApp-SPM/Package.swift || true

      - name: Add Export Compliance Flag to Info.plist
        run: |
          PLIST_PATH="ios/App/App/Info.plist"
          if [ -f "$PLIST_PATH" ]; then
            /usr/libexec/PlistBuddy -c "Add :MinimumOSVersion string 15.0" "$PLIST_PATH" || \
            /usr/libexec/PlistBuddy -c "Set :MinimumOSVersion 15.0" "$PLIST_PATH"

            /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST_PATH" || \
            /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" "$PLIST_PATH"
          fi

      # =========================================================================
      # 3. TỰ ĐỘNG CẬP NHẬT VERSION VÀ BUILD NUMBER
      # =========================================================================
      - name: Update Version and Build Number
        run: |
          cd ios/App
          xcrun agvtool new-marketing-version "1.9"
          xcrun agvtool new-version -all "${{ github.run_number }}"
          cd ../..

      # =========================================================================
      # 4. BUILD APP (UNSIGNED) & ĐÓNG GÓI THÀNH IPA
      # =========================================================================
      - name: Build Unsigned App and Package IPA
        run: |
          # 1. Tắt Code Signing trong Xcode Project
          ruby -r xcodeproj -e '
          project_path = "ios/App/App.xcodeproj"
          project = Xcodeproj::Project.open(project_path)

          project.targets.each do |target|
            target.build_configurations.each do |config|
              config.build_settings["IPHONEOS_DEPLOYMENT_TARGET"] = "15.0"
              config.build_settings["CODE_SIGNING_ALLOWED"] = "NO"
              config.build_settings["CODE_SIGNING_REQUIRED"] = "NO"
              config.build_settings["CODE_SIGN_IDENTITY"] = ""
              config.build_settings["EXPANDED_CODE_SIGN_IDENTITY"] = ""
            end
          end

          project.save
          puts "==> Đã tắt Code Signing cho toàn bộ project thành công!"
          '

          # 2. Build .app binary
          xcodebuild -project ios/App/App.xcodeproj \
                     -scheme App \
                     -configuration Release \
                     -sdk iphoneos \
                     -derivedDataPath build/DerivedData \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     ONLY_ACTIVE_ARCH=NO \
                     ARCHS="arm64" \
                     build

          # 3. Đóng gói thư mục App.app thành file App.ipa (Unsigned)
          mkdir -p build/output/Payload
          cp -R build/DerivedData/Build/Products/Release-iphoneos/App.app build/output/Payload/
          cd build/output
          zip -r App.ipa Payload
          rm -rf Payload

      # =========================================================================
      # 5. UPLOAD UN-SIGNED IPA LÊN GITHUB ARTIFACTS
      # =========================================================================
      - name: Upload Unsigned IPA to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-unsigned-app
          path: build/output/App.ipa
          retention-days: 7
